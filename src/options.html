<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的词袋 - 生词提取器</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>我的词袋</h1>
      <p class="subtitle">拾起的词都在这里 · 下次自动跳过</p>
    </header>

    <main>
      <!-- 统计信息 -->
      <div class="stats">
        <span id="totalCount">已拾起 <strong>0</strong> 个词汇</span>
      </div>

      <!-- 备份提醒 -->
      <div id="backupReminder" class="reminder hidden">
        <span class="reminder-icon">💡</span>
        <span>已超 100 词，建议导出备份 —— 卸载扩展后数据将丢失</span>
      </div>

      <!-- 添加单个词汇 -->
      <section class="section">
        <h2>快速入袋</h2>
        <div class="add-form">
          <input type="text" id="addInput" class="input" placeholder="输入单词，回车入袋...">
          <button id="addBtn" class="btn btn-primary">+</button>
        </div>
      </section>

      <!-- 导入词汇 -->
      <section class="section">
        <h2>批量导入</h2>
        <textarea id="importTextarea" class="textarea" placeholder="粘贴单词列表，支持换行/空格/逗号分隔..."></textarea>
        <div class="import-actions">
          <button id="importTextBtn" class="btn btn-secondary">导入文本</button>
          <label class="btn btn-secondary file-label">
            上传文件
            <input type="file" id="importFileBtn" accept=".txt" hidden>
          </label>
        </div>
      </section>

      <!-- 词汇列表 -->
      <section class="section">
        <h2>最近拾起</h2>
        <div id="wordList" class="word-list">
          <p class="empty-hint">暂无词汇，开始拾词吧 ✨</p>
        </div>
      </section>

      <!-- 导出和清空 -->
      <section class="section actions-footer">
        <button id="exportBtn" class="btn btn-secondary">
          <span class="btn-icon">💾</span> 导出备份
        </button>
        <button id="clearBtn" class="btn btn-danger">
          <span class="btn-icon">🗑️</span> 清空全部
        </button>
      </section>
    </main>

    <!-- 提示信息 -->
    <div id="message" class="message hidden"></div>
  </div>

  <script src="vocabulary.js"></script>
  <script src="options.js"></script>
</body>
</html>
