<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生词提取器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>拾起这页的 <span>生词</span> ✨</h1>
      <p class="subtitle">从当前网页智能挑出你还不会的词</p>
    </header>

    <main>
      <!-- 操作按钮 -->
      <div class="actions">
        <button id="extractBtn" class="btn btn-primary">
          <span class="btn-icon">📖</span>
          拾起本页生词
        </button>
      </div>

      <!-- 统计信息 -->
      <div id="stats" class="stats hidden">
        <span id="totalCount">拾起 <strong>0</strong> 个新词</span>
      </div>

      <!-- 预览区域 -->
      <div id="preview" class="preview hidden">
        <div class="preview-header">
          <span>预览 · TOP 30</span>
          <span>按字母序</span>
        </div>
        <div id="wordList" class="word-list"></div>
      </div>

      <!-- 导出操作 -->
      <div id="exportActions" class="export-actions hidden">
        <button id="copyBtn" class="btn btn-secondary">
          <span class="btn-icon">📋</span>
          复制全部
        </button>
        <button id="downloadBtn" class="btn btn-outline">
          <span class="btn-icon">💾</span>
          下载 TXT
        </button>
      </div>

      <!-- 提示信息 -->
      <div id="message" class="message hidden"></div>
    </main>

    <footer>
      <p class="footer-text">自动入袋 · 下次不再拾取</p>
      <a href="options.html" class="manage-link">📚 我的词袋</a>
    </footer>
  </div>

  <script src="vocabulary.js"></script>
  <script src="popup.js"></script>
</body>
</html>
