<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生词提取器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <!-- Browser Chrome 装饰 -->
    <div class="browser-chrome">
      <span class="chrome-dot rose"></span>
      <span class="chrome-dot amber"></span>
      <span class="chrome-dot emerald"></span>
      <div class="chrome-url">chrome-extension://生词提取器</div>
    </div>

    <!-- Header -->
    <div class="header-section">
      <div class="brand-tag">
        <span class="brand-icon">✨</span>
        <span>SHICI · PICK WORDS</span>
      </div>
      <h1>拾起这页的 <span class="accent">生词</span> ✨</h1>
      <p class="subtitle">从当前网页智能挑出你还不会的词</p>
    </div>

    <!-- Extract Button -->
    <div class="button-section">
      <button id="extractBtn" class="extract-btn">
        <div class="btn-glow"></div>
        <span class="btn-content">
          <span class="btn-icon">✨</span>
          拾起本页生词
        </span>
      </button>
    </div>

    <!-- Stats -->
    <div id="statsSection" class="stats-grid hidden">
      <div class="stat-card primary">
        <span class="stat-label">新词</span>
        <span id="newCount" class="stat-value">0</span>
      </div>
      <div class="stat-card secondary">
        <span class="stat-label">已过滤</span>
        <span id="filteredCount" class="stat-value">0</span>
      </div>
    </div>

    <!-- Preview -->
    <div id="previewSection" class="preview-section hidden">
      <div class="preview-header">
        <span class="preview-label">预览 · TOP 30</span>
        <span class="preview-order">按字母序</span>
      </div>
      <div id="wordList" class="word-chips"></div>
    </div>

    <!-- Actions -->
    <div id="actionsSection" class="actions-grid hidden">
      <button id="copyBtn" class="action-btn primary">
        <span class="btn-icon">📋</span>
        <span>复制全部</span>
      </button>
      <button id="downloadBtn" class="action-btn secondary">
        <span class="btn-icon">💾</span>
        <span>下载 TXT</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="footer-section">
      <span class="footer-note">自动入袋 · 下次不再拾取</span>
      <a href="options.html" class="footer-link">
        <span class="link-icon">📚</span>
        <span>我的词袋</span>
      </a>
    </div>

    <!-- Message -->
    <div id="message" class="message hidden"></div>
  </div>

  <script src="vocabulary.js"></script>
  <script src="popup.js"></script>
</body>
</html>
